<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>SiteName – Find the suburb that fits your life</title>
		<link rel="stylesheet" href="css/theme.css">
		<link rel="stylesheet" href="css/pages.css">
		<script src="data/suburbs.js" defer></script>
		<script src="data/rentals.js" defer></script>
		<script src="js/app.js" defer></script>
		<script src="js/components.js" defer></script>
		<script src="js/home.js" defer></script>
	</head>

	<body>
		<site-header></site-header>

		<main id="main">
			<section class="hero">
				<h1>Find the suburb that fits your life, not just a property.</h1>
				<p class="lead">Tell us what matters to you and we'll match you to suburbs that fit before you start hunting for a rental.</p>
				<a class="btn btn-primary btn-lg" href="quiz.html">Start matching <span aria-hidden="true">→</span></a>
			</section>

			<section class="search-band" aria-label="Search rentals">
				<form id="searchForm" class="search-form" role="search">
					<span aria-hidden="true">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
					</span>
					<label class="visually-hidden" for="q">Search rentals by suburb, street or postcode</label>
					<input id="q" name="q" type="search" placeholder="Find your next place to live!" autocomplete="off">
					<button type="submit" aria-label="Search">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
					</button>
				</form>
			</section>

			<section class="container recent" aria-labelledby="recentHeading">
				<h2 id="recentHeading">Recent rentals in Brisbane</h2>
				<p class="muted">Sample listings for the prototype. Live listings are still being connected.</p>
				<div class="carousel">
					<button class="btn-round" type="button" id="prevBtn" aria-label="Previous rentals"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg></button>
					<div class="carousel__track" id="track" role="list" aria-live="polite" tabindex="0" aria-label="Recent rentals, scroll sideways"></div>
					<button class="btn-round" type="button" id="nextBtn" aria-label="Next rentals"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button>
				</div>
			</section>
		</main>

		<site-footer></site-footer>
	</body>
</html>
